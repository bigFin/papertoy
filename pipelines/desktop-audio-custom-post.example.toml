[[passes]]
kind = base
path = "${PAPERTOY_DEFAULT_SHADER}"

[[passes]]
kind = postprocess
effect = pulse_zoom
strength = 0.55

[[passes]]
kind = postprocess
path = "audio-soft-vignette.post.glsl"
strength = 0.85

[audio]
enabled = true
capture = sink
target = "auto"

[modulation]
time_reactive = true
time_strength = 1.25
visual_reactive = false
visual_strength = 0.55
visual_style = blend
