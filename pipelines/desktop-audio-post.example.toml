# Set PAPERTOY_DEFAULT_SHADER to your preferred shader path before running.

[[passes]]
kind = base
path = "${PAPERTOY_DEFAULT_SHADER}"

[[passes]]
kind = postprocess
effect = pulse_zoom
strength = 0.95

[[passes]]
kind = postprocess
effect = glow_grade
strength = 0.85

[[passes]]
kind = postprocess
effect = heat_shift
strength = 0.55

[[passes]]
kind = postprocess
effect = impact_flash
strength = 0.75

[audio]
enabled = true
capture = sink
target = "auto"

[modulation]
time_reactive = true
time_strength = 2.0
visual_reactive = false
visual_strength = 1.0
visual_style = blend
